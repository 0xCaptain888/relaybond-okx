openapi: 3.1.0
info:
  title: RelayBond API
  version: 0.4.0-rc.1
  description: Bond-backed paid Agent services with portable delivery evidence and double-pay-free recovery.
servers:
  - url: https://relaybond-okx.vercel.app
paths:
  /health:
    get:
      operationId: relaybondHealth
      responses:
        "200":
          description: Runtime status
  /v1/provider/quote:
    post:
      operationId: getBondBackedQuote
      summary: Purchase a fresh market quote protected by a Quality Bond
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [symbol]
              properties:
                symbol: { type: string, examples: [BTC-USDT] }
                scenario:
                  type: string
                  enum: [accepted, empty, stale]
                  default: accepted
                  description: Paid breach scenarios are disabled unless the operator explicitly enables the testnet demo.
      responses:
        "200":
          description: Paid result plus signed promise and delivery receipt
        "402":
          description: x402 challenge in the PAYMENT-REQUIRED header
  /v1/provider/v2-primary:
    post:
      operationId: getBondedV2PrimaryBreach
      summary: Purchase the intentionally stale V2 Primary delivery used for a reviewed recovery test
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [symbol, scenario]
              properties:
                symbol: { type: string, examples: [BTC-USDT] }
                scenario: { type: string, const: stale }
      responses:
        "200":
          description: Paid signed stale delivery for independent breach verification
        "402":
          description: x402 challenge in the PAYMENT-REQUIRED header
  /v1/service/promise:
    get:
      operationId: getRelayBondServicePromise
      summary: Inspect the signed SLA before payment
      responses:
        "200":
          description: EIP-712 signed Service Promise and typed-data digest
  /v1/service/v2-primary/promise:
    get:
      operationId: getBondedV2PrimaryPromise
      summary: Inspect the bonded V2 Primary SLA before payment
      responses:
        "200":
          description: Testnet-bonded Primary EIP-712 Service Promise
  /v1/providers:
    get:
      operationId: listBondedProviders
      summary: List providers ranked by bond, SLA and verified reliability
      responses:
        "200":
          description: Public routing metadata for the two independently bonded TESTNET Providers
  /v1/recovery/demo:
    get:
      operationId: getContinuityRecoveryDemo
      summary: Inspect a verifier-signed recovery where the buyer pays once
      responses:
        "200":
          description: Deterministic LOCAL Continuity Receipt and recovery economics
  /v1/official/coordinator:
    get:
      operationId: getOfficialBuildCoordinatorEvidence
      summary: Inspect the post-start automatic routing and fail-closed recovery evidence
      responses:
        "200":
          description: Official-period LOCAL coordinator evidence with RECOVERED and FROZEN runs
  /v1/official/settlement:
    get:
      operationId: getOfficialV2Settlement
      summary: Inspect the completed X Layer Testnet bond-funded recovery settlement
      responses:
        "200":
          description: Transaction, balances and seven independently checked post-settlement invariants
  /v1/official/readiness:
    get:
      operationId: getOfficialProviderRuntimeReadiness
      summary: Inspect provider configuration, transport and payment safety without exposing secrets
      responses:
        "200":
          description: Honest runtime readiness with explicit configuration and V2 settlement status
  /v1/verify:
    post:
      operationId: verifyRelayBondDelivery
      summary: Independently verify a signed service delivery
      responses:
        "200":
          description: ACCEPTED or BREACH with deterministic checks
